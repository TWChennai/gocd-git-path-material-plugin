name: Gradle Dependency Submission

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/dependency_submission.yml'
      - 'build.gradle'
      - 'settings.gradle'
      - '**/gradle/**'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin
          cache: gradle
      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: github.ref == 'refs/heads/master'
        env:
          GITHUB_DEPENDENCY_GRAPH_JOB_CORRELATOR: master
          DEPENDENCY_GRAPH_INCLUDE_CONFIGURATIONS: runtimeClasspath
